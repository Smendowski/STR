[project]
name = "STR"
version = "0.1.0"
description = "Default template for PDM package"
authors = [
    {name = "Mateusz Smendowski", email = "m.smendowski@gmail.com"},
]

dependencies = [
    "pandas>=2.2.2",
    "notebook>=7.2.2",
    "matplotlib>=3.9.2",
    "scikit-learn>=1.5.1",
    "numpy==2.0",
    "fastparquet>=2024.5.0",
    "torch>=2.4.1",
    "seaborn>=0.13.2",
    "codecarbon>=2.8.2",
    "pre-commit>=4.0.1",
    "scienceplots>=2.1.1",
    "latex>=0.7.0",
    "pydantic>=2.11.4",
    "ptitprince>=0.2.5",
    "dill>=0.4.0",
    "statsmodels>=0.14.6",
    "tqdm>=4.67.3",
    "adjustText>=1.3.0",
]

requires-python = "==3.11.*"
readme = "README.md"
license = {text = "MIT"}

[tool.pdm]
distribution = false

[tool.pdm.dev-dependencies]
test = [
    "pytest>=8.3.2",
]
lint = [
    "isort>=5.13.2",
    "flake8>=7.1.1",
    "black>=24.8.0",
    "pre-commit>=4.0.1",
]

[tool.isort]
profile = "black"

[tool.black]
line-length = 80
